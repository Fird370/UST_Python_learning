name: Run python
run-name: ${{ github.actor }} is testing out GitHub Actions for python
on: 
    pull_request:
jobs:
  run-python:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.11"
        
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt


      - name: Run script
        run: python main.py